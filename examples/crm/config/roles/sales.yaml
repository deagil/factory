# Sales: their own deals only, the organisations and contacts around them,
# and agents of their own.
key: sales
label: Sales
objects:
  organisation: { endpoints: "*", rows: all }
  contact:
    endpoints: [list, get, create, update, history]
    rows: all
    write: { except: [organisation] } # contact.moveToOrganisation moves it
  deal:
    endpoints: [list, get, update, history]
    rows: own # the deal's owner is them
    write: { except: [stage] } # deal.moveStage moves it
workflows:
  - contact.moveToOrganisation
  - deal_create
  - deal.moveStage
  - actor.createAgent
  - apiKey.create
  - apiKey.revoke
