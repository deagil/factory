# Sales managers: every deal, not just their own, and changes to config in
# drafts, which an admin approves (config/approvals/config_changes.yaml).
# They invite people and set roles, but can't give a role that does more
# than theirs, such as admin: the privilege ceiling.
key: manager
label: Manager
objects:
  organisation: { endpoints: "*", rows: all }
  contact:
    endpoints: [list, get, create, update, history]
    rows: all
    write: { except: [organisation] } # contact.moveToOrganisation moves it
  deal:
    endpoints: [list, get, update, history]
    rows: all
    write: { except: [stage] } # deal.moveStage moves it
  task: { endpoints: "*", rows: all }
workflows:
  - contact.moveToOrganisation
  - deal_create
  - deal.moveStage
  - deal_move_stage # any deal: manager rows are all
  - actor.createAgent
  - apiKey.create
  - apiKey.revoke
  - user.invite
  - actor.setRoles
  - draft.open
  - draft.save
  - draft.mine
  - draft.revert
  - draft.discard
  - draft.publish
  - draft.list
  - draft.get
  - draft.files
  - role.list
