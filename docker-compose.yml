# Local Postgres for development and tests. Start with `pnpm db:up`.
name: factory

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: factory
      # Local only: no password, and the port is bound to 127.0.0.1 below.
      POSTGRES_HOST_AUTH_METHOD: trust
    # Each test file gets its own database (P0.06), and turbo runs packages in
    # parallel, so allow more connections than the default 100.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factory"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
